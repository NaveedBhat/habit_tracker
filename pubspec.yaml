name: habit_tracker
description: Daily Habit Tracker - Flutter, clean architecture, Firebase Firestore.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.0.0
  dartz: ^0.10.1
  get_it: ^7.7.0
  go_router: ^14.2.0
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/daily-tracker.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/daily-tracker.png
